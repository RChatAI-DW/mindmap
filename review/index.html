:root{
  --ink:#191F28; --sub:#4E5968; --faint:#8B95A1;
  --bg:#FFFFFF; --soft:#F2F4F6; --line:#E5E8EB; --line2:#D1D6DB;

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--soft);color:var(--ink);font-family:"SUIT","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
textarea,input{font-family:inherit;font-size:17px;color:inherit}
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}

/* 위 띠 */
#top{flex:none;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px}
#top .home{width:40px;height:40px;border-radius:12px;color:var(--sub);display:grid;place-items:center}

#top .count{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
#sync{font-size:14px;color:var(--faint);min-width:0}

/* 카드 무대 */
#stage{flex:1;position:relative;min-height:0}
.ghost,.card{position:absolute;left:16px;right:16px;top:4px;bottom:28px;border-radius:var(--r-card);background:var(--bg)}
.ghost{box-shadow:0 1px 3px rgba(0,23,51,.06);transform-origin:50% 100%}
.ghost.g1{transform:translateY(12px) scale(.95);opacity:.8;overflow:hidden;pointer-events:none;user-select:none}
.ghost .peek{padding:22px 20px 24px}
.ghost.g2{transform:translateY(24px) scale(.9);opacity:.5}
.card{box-shadow:var(--float);padding:22px 20px 24px;overflow-y:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.card textarea,.card input{user-select:text;-webkit-user-select:text}
.card.enter-left{animation:inL .2s ease}
.card.enter{animation:none}   /* 뒤 카드가 이미 앞자리로 올라와 있어 따로 나타나는 효과 없음 */
@keyframes inL{from{transform:translateX(-60px);opacity:0}}
@keyframes inN{from{transform:scale(.97);opacity:.6}}
.card.shake{animation:shake .3s}

.meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:28px}
.tag{font-size:14px;color:var(--sub);background:var(--soft);border-radius:8px;padding:3px 10px}

.flow{display:flex;flex-direction:column}

.arrow{width:2px;height:20px;background:var(--line2);margin:0 auto;position:relative}

.chf textarea{flex:1;resize:none;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:16px}
.chsend{background:var(--ink);color:#fff;border-radius:12px;padding:0 18px;font-weight:600}

.dtool{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}

  q: { name: '질문', desc: '현장 기준을 확인하는 질문', step: '4 카테고리별 작업 — 기준 · 자료' },
  a: { name: '상담 답 검수', desc: '실제 상담 답이 맞는지', step: '결과 확인 → 틀린 단계를 고침' },
};
const ORDER = ['p', 'q'];
const A_OPTS = ['맞다', '틀린 데가 있다 (적기)'];
// 틀린 곳 — 고를 때 상담 어느 단계 문제인지 함께 남는다
const WHERE = [
  ['물어야 할 걸 안 물음', '①'], ['안 물어도 될 걸 물음', '①'], ['말을 잘못 알아들음', '①'],
  ['엉뚱한 부품·메이커', '②'], ['값·계산이 틀림', '②'], ['빠진 부품·부속', '②'],
  ['설명이 틀림', '③'], ['말이 어색함', '③'],
];
const W = '(적기)';
const CHEV = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const LS = 'jh-review-v1';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let D = null, A = {}, EP = null, deck = null, idx = 0, pending = {}, flushT = 0, online = true, fromLeft = false;

// ── 저장 ──
//   이 브라우저에 먼저 두고 서버로 모아 보낸다. 보관본 = { ep: 서버 초기화 번호, a: 답 } — 서버가 초기화되면 번호가 달라 버린다.
//   로컬(serve.py): api/answers 에 0.8초 모아 보냄.
//   게시본(window.CFG 있음): 마인드맵 함수 v3 칸 — 카드 자료 CFG.dataCate(비밀번호가 있어야 읽힘),
//     답 CFG.ansCate(노드 = 카드 번호, x = 답 JSON, 「meta」 = 초기화 번호).
//     고치면 바로(0.3초 모아) 보낸다 — 서버 저장에 3초쯤 걸린다(데이터 저장소 커밋). 관문이 IP당 분당 10회라 이어서 고치면 7초 간격으로 모아 보내고,
//     창을 닫거나 다른 탭으로 가면 기다리지 않고 그 자리에서 보낸다(대표 10/26 「수정되면 바로바로 서버에」).
const CFG = window.CFG || null;
const LS_PW = 'jh-review-pw';
let PW = '', lastSave = 0, lastLoad = 0, HIST = [];
function readLocal() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; } }
function writeLocal() { try { localStorage.setItem(LS, JSON.stringify({ ep: EP, a: A })); } catch {} }
function put(id, patch, noHist) {
  if (!noHist) remember(id, Object.keys(patch));
  A[id] = { ...(A[id] || {}), ...patch, t: Date.now() };
  pending[id] = A[id];
  writeLocal();
  schedule();
  sync('저장 중');
}
function schedule(ms) {
  clearTimeout(flushT);
  flushT = setTimeout(flush, ms ?? (CFG ? Math.max(300, lastSave + 7000 - Date.now()) : 300));
}
let flushing = false;
async function flush(now) {
  if (flushing && !now) return schedule(1000);
  const send = pending; pending = {};
  flushing = true;
  try { await flushSend(send, now); } finally { flushing = false; }
}
// 창을 닫거나 다른 탭으로 갈 때 — 남은 것을 바로 보낸다(keepalive: 창이 닫혀도 요청은 간다)
function flushNow() { if (Object.keys(pending).length) { clearTimeout(flushT); flush(true); } }
window.addEventListener('pagehide', flushNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushNow(); });
async function flushSend(send, now) {
  if (!Object.keys(send).length) return;
  try {
    const res = CFG ? await webSave(send, now) : await localSave(send, now);
    if (res.reset) {   // 서버 답이 초기화됨 — 이 브라우저 답도 서버 판으로
      EP = res.epoch; A = res.answers; pending = {}; HIST = []; writeLocal();
      toast('서버 답이 초기화되어 새로 불러왔습니다');
      return deck ? go(deck, 0) : renderHome();
    }
    if (res.answers && adopt(res.answers) && deck && list()[idx]) rerender();   // 다른 기기에서 고친 것
    online = true; sync('저장됨');
  } catch (e) {
    for (const k in send) if (!pending[k]) pending[k] = send[k];
    if (e && e.auth) return askPw('비밀번호가 바뀌었습니다. 다시 넣어 주세요.');
    online = false; sync('서버 끊김 · 이 브라우저에 보관');
    schedule(e && e.retry ? e.retry * 1000 : (CFG ? 15000 : 5000));
  }
}
function adopt(sv) {
  let ch = false;
  for (const k in sv) if (!pending[k] && (sv[k].t || 0) > ((A[k] || {}).t || 0)) { A[k] = sv[k]; ch = true; }
  if (ch) writeLocal();
  return ch;
}
function sync(t) { const el = $('#sync'); if (el) el.textContent = t; }

// 로컬
async function localLoad() {
  const deckData = await (await fetch('deck.json')).json();
  const r = await fetch('api/answers'); if (!r.ok) throw new Error(r.status);
  const sv = await r.json();
  return { deck: deckData, epoch: sv.epoch, answers: sv.answers };
}
async function localSave(send, keepalive) {
  const r = await fetch('api/answers', { method: 'POST', keepalive: !!keepalive, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ epoch: EP, answers: send }) });
  if (r.status === 409) { const sv = await r.json(); return { reset: true, epoch: sv.epoch, answers: sv.answers }; }
  if (!r.ok) throw new Error(r.status);
  return {};
}

// 게시본 — 답 노드에 초기화 번호(ep)를 같이 적어, 초기화 전 브라우저가 늦게 보낸 답은 읽을 때 버린다
async function mm(body, keepalive) {
  const r = await fetch(CFG.fn, {
    method: 'POST', keepalive: !!keepalive,
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ pw: PW, ns: 'v3', ...body }),
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw { auth: true };
  if (r.status === 429) throw { retry: +(r.headers.get('Retry-After') || 30) };
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function readAnswers(nodes) {
  let ep = '0';
  if (nodes && nodes.meta && !nodes.meta.d) { try { ep = JSON.parse(nodes.meta.x).epoch || '0'; } catch {} }
  const a = {};
  for (const [id, n] of Object.entries(nodes || {})) {
    if (n.d || id === 'meta') continue;
    try { const rec = JSON.parse(n.x); if ((rec.ep || '0') === ep) { delete rec.ep; a[id] = rec; } } catch {}
  }
  return { ep, a };
}
async function webLoad() {
  const dd = (await mm({ op: 'load', cate: CFG.dataCate })).doc;
  if (!dd || !dd.nodes['d-meta']) throw new Error('카드 자료 없음');
  const meta = JSON.parse(dd.nodes['d-meta'].x);
  let text = '';
  for (let i = 0; i < meta.n; i++) text += dd.nodes['d-' + String(i).padStart(4, '0')].x;
  const ad = (await mm({ op: 'load', cate: CFG.ansCate })).doc;
  const { ep, a } = readAnswers(ad && ad.nodes);
  lastLoad = Date.now();
  return { deck: JSON.parse(text), epoch: ep, answers: a };
}
// 노드 한 개는 4,000자까지(마인드맵 함수) — 넘치면 의견의 답 앞부분 · 손님 말부터 줄인다
function nodeX(rec) {
  let r = { ...rec, ep: EP }, x = JSON.stringify(r);
  if (x.length > 3900 && (r.a || r.u)) { r = { ...r, a: String(r.a || '').slice(0, 80), u: String(r.u || '').slice(0, 80) }; x = JSON.stringify(r); }
  while (x.length > 3900 && ((r.ask || '').length || (r.fix || '').length)) {   // 줄바꿈·따옴표가 아주 많은 의견뿐 — 긴 쪽 끝을 자른다
    const k = (r.fix || '').length >= (r.ask || '').length ? 'fix' : 'ask';
    r = { ...r, [k]: r[k].slice(0, Math.max(0, r[k].length - Math.ceil((x.length - 3900) / 2) - 10)) };
    x = JSON.stringify(r);
  }
  return x;
}
async function webSave(send, keepalive) {
  const nodes = {};
  for (const [id, rec] of Object.entries(send)) nodes[id] = { p: '', t: 'a', x: nodeX(rec), u: rec.t || Date.now(), o: 0 };
  lastSave = Date.now();
  const doc = (await mm({ op: 'save', cate: CFG.ansCate, doc: { cate: CFG.ansCate, name: '재현 지식 검수 답', nodes } }, keepalive)).doc;
  const { ep, a } = readAnswers(doc.nodes);
  return ep !== EP ? { reset: true, epoch: ep, answers: a } : { answers: a };
}
// 다른 기기에서 고친 답 받기 — 창으로 돌아왔을 때, 1분에 한 번까지
document.addEventListener('visibilitychange', async () => {
  if (!CFG || document.hidden || !D || Date.now() - lastLoad < 60000 || Object.keys(pending).length) return;
  lastLoad = Date.now();
  try {
    const { ep, a } = readAnswers(((await mm({ op: 'load', cate: CFG.ansCate })).doc || {}).nodes);
    if (ep !== EP) { EP = ep; A = a; HIST = []; writeLocal(); toast('서버 답이 초기화되어 새로 불러왔습니다'); return deck ? go(deck, 0) : renderHome(); }
    if (adopt(a) && deck && list()[idx]) rerender();
  } catch {}
});
function askPw(msg) {
  $('#top').innerHTML = ''; $('#bar').innerHTML = '';
  $('#stage').innerHTML = `<div class="home-wrap">
    <h1>지식 검수</h1><p class="lead">${esc(msg || '비밀번호를 넣어 주세요.')}</p>
    <form id="pwf"><input id="pw" type="password" class="pwin" autocomplete="current-password" aria-label="비밀번호">
    <button class="wide ink" style="margin-top:12px">들어가기</button></form></div>`;
  $('#pwf').onsubmit = e => {

// ── 되돌리기 — 바꾸기 전 답을 쌓아 두고 하나씩 되돌린다(같은 카드·같은 칸을 1.5초 안에 이어 고치면 한 번으로)
function remember(id, keys) {
  const k = keys.slice().sort().join(','), last = HIST[HIST.length - 1], now = Date.now();
  if (last && last.id === id && last.k === k && now - last.at < 1500) { last.at = now; return; }
  HIST.push({ id, k, at: now, prev: A[id] ? JSON.parse(JSON.stringify(A[id])) : null });
  if (HIST.length > 100) HIST.shift();
  undoBtn();
}
function undo() {
  const h = HIST.pop();
  undoBtn();
  if (!h) return toast('되돌릴 것이 없습니다');
  A[h.id] = h.prev ? { ...h.prev, t: Date.now() } : { t: Date.now() };
  pending[h.id] = A[h.id];
  writeLocal(); schedule(); sync('저장 중');
  toast('되돌렸습니다');
  for (const k of ORDER) {
    const i = D.decks[k].findIndex(c => c.id === h.id);
    if (i >= 0) return go(k, i);
  }
  if (location.hash === '#sum') renderSummary();
}
const UNDO_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>';
const undoHtml = () => `<button id="undo" class="undo" aria-label="되돌리기" title="되돌리기 (Ctrl+Z)" ${HIST.length ? '' : 'disabled'}>${UNDO_SVG}</button>`;
function undoBtn() { const b = $('#undo'); if (b) b.disabled = !HIST.length; }
function bindUndo() { const b = $('#undo'); if (b) b.onclick = undo; }

// ── 덱 도우미 ──
const list = () => D.decks[deck];
const st = id => (A[id] || {}).status;
const seen = id => !!st(id);
const section = c => deck === 'q' ? c.topic.split(' · ')[0] : deck === 'a' ? c.topic : c.group;
const isW = o => o.endsWith(W);
const optLabel = o => isW(o) ? o.slice(0, -W.length).trim() : o;
const firstOpen = (from = 0) => { const L = list(); for (let i = from; i < L.length; i++) if (!seen(L[i].id)) return i; return -1; };
function countDeck(k) {
  const L = D.decks[k]; let done = 0, later = 0;
  for (const c of L) { const s = st(c.id); if (s === 'later') later++; else if (s) done++; }
  return { n: L.length, done, later };
}

// ── 화면 ──
function go(k, i) {
  deck = k;
  if (k == null) { location.hash = ''; return renderHome(); }
  if (k === 'guide') { deck = null; history.replaceState(null, '', '#guide'); return renderGuide(); }
  if (k === 'sum') return renderSummary();
  if (k === 'chat') return renderTest();
  if (i == null) { i = firstOpen(); if (i < 0) i = list().length; }
  idx = i;
  history.replaceState(null, '', `#${k}/${idx}`);
  render();
}

// 처음 화면 — 카드(부품 지식 · 질문)는 10/26 저녁 「카테고리별 질문으로 상담해 보고 의견」으로 바꿔 내렸다.
//   카드에 남긴 답은 서버에 그대로 있고 「답 모아 보기」에서 본다. 카드 화면은 주소(#p/0 · #q/0)로만 열린다.
function renderHome() {
  wide(false);
  $('#top').innerHTML = `<div style="flex:1"></div><span id="sync"></span>`;
  $('#bar').innerHTML = '';
  const tc = testCount();
  $('#stage').innerHTML = `<div class="home-wrap">
    <h1>지식 검수</h1>
    <p class="lead">질문으로 상담해 보고, 답마다 고칠 점을 남겨 주세요.</p>
    <button class="tile guide" data-k="guide"><b>상담 구조</b><span>상담이 어떻게 돌아가고, 남긴 의견이 어디에 들어가는지</span></button>
    <button class="tile" data-k="chat"><b>상담 테스트</b><span>카테고리별 질문으로 상담해 보고, 답마다 되물어야 할 것 · 바꿔야 할 내용을 남깁니다</span>
      <div class="bar"><i style="width:${tc.n ? (100 * tc.run / tc.n).toFixed(1) : 0}%"></i></div>

  $('#stage').querySelectorAll('.tile,.sumlink').forEach(b => b.onclick = () => go(b.dataset.k));
  sync(online ? '' : '서버 끊김 · 이 브라우저에 보관');
}

function render() {
  const L = list(), c = L[idx];
  const secName = c ? section(c) : '';
  $('#top').innerHTML = `
    <button class="home" aria-label="처음 화면">${CHEV}</button>
    <button class="title">${DECKS[deck].name}<small>${esc(secName)} ▾</small></button>
    <span id="sync"></span>
    <span class="count">${Math.min(idx + 1, L.length)} / ${L.length}</span>${undoHtml()}`;
  $('#top .home').onclick = () => go(null);
  bindUndo();
  $('#top .title').onclick = openSheet;
  sync(online ? (Object.keys(pending).length ? '저장 중' : '') : '서버 끊김 · 이 브라우저에 보관');

  if (!c) return renderEnd();
  const n = L.length - idx;
  $('#stage').innerHTML =
    (n > 2 ? '<div class="ghost g2"></div>' : '') +
    (n > 1 ? `<div class="ghost g1"><div class="peek">${KIND[deck][0](L[idx + 1])}</div></div>` : '') +   // 바로 뒤 카드는 내용까지 그려 둔다
    `<div class="card ${fromLeft ? 'enter-left' : 'enter'}"><div class="drag"></div>${KIND[deck][0](c)}</div>`;
  fromLeft = false;
  const card = $('#stage .card');
  KIND[deck][1](card, c);
  bindSwipe(card);
  fitTouch(card);

  $('#bar').innerHTML = `
    <button class="prev" ${idx === 0 ? 'disabled' : ''} aria-label="이전">${CHEV}</button>
    <button class="later">↑ 나중에</button>
    <button class="next">${deck === 'p' ? '확인 ›' : '다음 ›'}</button>`;
  $('#bar .prev').onclick = prev;
  $('#bar .later').onclick = later;
  $('#bar .next').onclick = next;
}

const badge = id => { const s = st(id); return s ? `<span class="st ${s}">${s === 'later' ? '나중에' : s === 'ans' ? '답함' : '확인함'}</span>` : ''; };

// 질문 카드
function qCard(c) {
  const r = A[c.id] || {}, ch = r.choice || [];
  const wOpen = !c.opts.length || r.w || (r.text || '').trim() || ch.some(i => isW(c.opts[i] || ''));
  return `<div class="meta"><span class="tag">${esc(c.topic)}</span>${badge(c.id)}</div>
    <h2 class="qt">${esc(c.q)}</h2>
    ${c.ctx ? `<p class="ctx">${esc(c.ctx)}</p>` : ''}
    ${c.opts.length ? `<div class="opts">${c.opts.map((o, i) => `
      <button class="opt ${ch.includes(i) ? 'on' : ''}" data-i="${i}"><span class="n">${c.multi ? (ch.includes(i) ? '✓' : '') : i + 1}</span><span>${esc(optLabel(o))}</span>${isW(o) ? '<span class="pen">✎</span>' : ''}</button>`).join('')}</div>` : ''}
    ${c.opts.length && !wOpen ? '<button class="wbtn">✎ 직접 적기</button>' : ''}
    ${wOpen ? `<textarea class="txt" maxlength="1500" placeholder="${c.opts.length ? '덧붙일 말이나 맞는 답을 적어 주세요' : '여기에 적어 주세요'}">${esc(r.text || '')}</textarea>` : ''}`;
}
function bindQ(card, c) {
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(c, +b.dataset.i));
  const wb = $('.wbtn', card);
  if (wb) wb.onclick = () => { put(c.id, { w: 1 }); rerender(true); };
  const ta = $('.txt', card);
  if (ta) ta.oninput = () => put(c.id, { text: ta.value });
}
function pick(c, i) {
  if (i >= c.opts.length) return;
  let ch = [...((A[c.id] || {}).choice || [])];
  if (c.multi) ch = ch.includes(i) ? ch.filter(x => x !== i) : [...ch, i].sort((a, b) => a - b);
  else ch = ch[0] === i ? [] : [i];
  put(c.id, { choice: ch });
  rerender(isW(c.opts[i]) && ch.includes(i));
}

// 부품 카드
//   기록: items(지금 칩 목록) · on(켜진 칩) · add(새로 더한 칩) · ren({원래 이름: 새 이름}) · del(뺀 원래 칩) · memo
const pItems = c => (A[c.id] || {}).items || c.items;
function pOn(c) { return new Set((A[c.id] || {}).on || c.sel); }
const origOf = (r, name) => Object.keys(r.ren || {}).find(k => r.ren[k] === name) ?? name;
const chipW = t => Math.max(2.5, [...t].reduce((a, ch) => a + (/[\u3131-\uD79D]/.test(ch) ? 1 : 0.62), 0) + 0.6);
function pSave(c, items, on, extra) { put(c.id, { items, on: items.filter(x => on.has(x)), ...extra }); }
function chipRename(c, old, nw) {
  nw = nw.trim();
  if (nw === old) return false;
  if (!nw) { chipRemove(c, old); return true; }
  const r = A[c.id] || {}, on = pOn(c), had = on.has(old), merge = pItems(c).includes(nw);

// ── 상담 테스트 — 카테고리별 질문으로 라이브 상담에 묻고, 답마다 「되물어야 할 것 · 바꿔야 할 내용」을 남긴다(대표 10/26 저녁, 카드 대신)
//   관문 비밀번호 → consult-trace 가 서버 안에서 회사 시험 계정으로 라이브 상담 함수(chat)를 부르고, 답이 끝나면 그 상담의 판단 기록을 읽는다.
//   답 칸에 남는 것 — tq-<질문 번호> {runs:[{sid, at}]} 그 질문으로 연 상담 · tq-free-<카테고리> {runs:[{sid, at, q}]} 직접 물어본 상담
//                    fb-<답 번호> {cat, q, qt, sid, u 손님 말, a 답 앞부분, ok 괜찮음, ask 되물어야 할 것, fix 바꿔야 할 내용}
const LS_DEV = 'jh-chat-device', LS_CAT = 'jh-test-cat';
let CH = { cat: null, q: null, qtext: '', sid: null, msgs: [], sel: null, busy: false, live: '' };
const TCATS = () => (D && D.decks.t) || [];
const catOf = k => TCATS().find(c => c.key === k) || TCATS()[0];
const runsKey = (cat, q) => q ? 'tq-' + q : 'tq-free-' + cat;
const runsOf = (cat, q) => (A[runsKey(cat, q)] || {}).runs || [];
const fbHas = r => !!r && !!((r.ask || '').trim() || (r.fix || '').trim());
const fbList = () => Object.entries(A).filter(([k, r]) => k.startsWith('fb-') && (r.ok || fbHas(r))).map(([k, r]) => ({ ...r, mid: +k.slice(3) }));
const fmtAt = ms => { if (!ms) return ''; const d = new Date(ms), p = n => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function wide(on) { document.body.classList.toggle('wide', !!on); }
function testCount() {
  const qs = TCATS().flatMap(c => c.qs.map(q => [c.key, q.id]));
  const fbs = fbList();
  return { n: qs.length, run: qs.filter(([c, q]) => runsOf(c, q).length).length, fb: fbs.filter(fbHas).length, ok: fbs.filter(r => r.ok && !fbHas(r)).length };
}
// 줄 오른쪽 표시 — 의견 수 > 괜찮음 > 해 봄
function pill(fbs, ran) {
  const n = fbs.filter(fbHas).length;
  if (n) return `<span class="qs fb">의견 ${n}</span>`;
  if (fbs.some(r => r.ok)) return '<span class="qs ok">괜찮음</span>';
  return ran ? '<span class="qs run">해 봄</span>' : '';
}
function chDevice() {
  let d = null; try { d = localStorage.getItem(LS_DEV); } catch {}
  if (!d) { d = 'web-dev-trace-' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem(LS_DEV, d); } catch {} }
  return d;
}
// 관문 비밀번호로 부른다 — consult-trace 가 서버 안에서 회사 시험 계정으로 로그인해 상담·기록을 다룬다(계정 비밀번호는 브라우저에 없음)
function chCall(body) {
  return fetch(`${CFG.url}/functions/v1/consult-trace`, {
    method: 'POST', headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon, 'Content-Type': 'application/json' },
    body: JSON.stringify({ pw: PW, ...body }),
  });
}
async function chTrace(sid) {
  const r = await chCall({ op: 'trace', session_id: sid });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw { login: true };
  if (!r.ok) throw new Error(j.error || ('판단 기록 읽기 실패 ' + r.status));
  return j.messages || [];
}

// 질문 목록 — 카테고리 칩 · 질문 줄(누르면 새 상담으로 바로 물음) · 직접 물어본 것 · 직접 물어보기

    ${free.length ? `<h2>직접 물어본 것</h2><div class="qlist">${free.map(r => `<button class="qrow" data-s="${r.sid}"><span class="qt2">${esc(r.q)}</span>${pill(fbs.filter(x => x.sid === r.sid), true)}</button>`).join('')}</div>` : ''}
    <form id="frf" class="free"><h2>직접 물어보기</h2><div class="chf"><textarea id="frin" rows="2" aria-label="직접 물어볼 말"></textarea><button class="chsend">보내기</button></div></form>
  </div>`;
  $('#stage').querySelectorAll('.cat').forEach(b => b.onclick = () => renderTest(b.dataset.c));
  $('#stage').querySelectorAll('.qrow[data-q]').forEach(b => b.onclick = () => openConv(c.key, b.dataset.q, runsOf(c.key, b.dataset.q).length ? null : 'ask'));

  $('#frin').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#frf').requestSubmit(); } };

// 상담 화면 — key = 질문 번호 또는 s<상담 번호>(직접 물어본 것). mode 'ask' = 새 상담으로 지금 묻기, 없으면 마지막에 물은 상담을 보여 준다
async function openConv(k, key, mode) {
  const c = catOf(k), free = /^s\d+$/.test(key || '');
  const q = free ? null : c && c.qs.find(x => x.id === key);
  if (!c || (!free && !q)) return renderTest(c && c.key);
  const runs = runsOf(c.key, q ? q.id : null);
  const ch = CH = { cat: c.key, q: q ? q.id : null, qtext: q ? q.q : '', sid: null, msgs: [], sel: null, busy: false, live: '' };
  if (free) { ch.sid = +key.slice(1); ch.qtext = (runs.find(r => r.sid === ch.sid) || {}).q || ''; }
  else if (mode !== 'ask' && runs.length) ch.sid = runs[runs.length - 1].sid;
  history.replaceState(null, '', `#chat/${c.key}/${key}`);
  renderConv();
  if (mode === 'ask') return chSend(ch.qtext);
  if (ch.sid) await chShow(ch, ch.sid);
}
function openFree(k, text) {
  CH = { cat: k, q: null, qtext: text, sid: null, msgs: [], sel: null, busy: false, live: '' };
  history.replaceState(null, '', `#chat/${k}/new`);
  renderConv();
  chSend(text);
}
// 상담 기록을 읽어 보여 준다 — 읽는 사이 다른 질문으로 옮겼으면 버린다
async function chShow(ch, sid) {
  if (!CFG) return;
  let msgs;
  try { msgs = await chTrace(sid); }
  catch (e) { if (e && e.login) return askPw('비밀번호가 맞지 않습니다.'); if (CH === ch) toast(e.message || '기록을 못 읽었습니다'); return; }
  if (CH !== ch || ch.sid !== sid) return;
  ch.msgs = msgs;
  const last = [...msgs].reverse().find(m => m.role === 'assistant');
  ch.sel = last ? last.id : null;
  chRender();
}
function renderConv() {
  deck = null; wide(true);
  const c = catOf(CH.cat), i = CH.q ? c.qs.findIndex(x => x.id === CH.q) : -1;
  $('#top').innerHTML = `<button class="home" aria-label="질문 목록">${CHEV}</button><button class="title">${esc(c.name)}<small>${i >= 0 ? `${i + 1} / ${c.qs.length}` : '직접 물어봄'}</small></button><span id="sync"></span>
    <button class="chnew" id="again">다시 묻기</button>${i >= 0 && i < c.qs.length - 1 ? '<button class="chnew ink" id="nextq">다음 질문 ›</button>' : ''}`;
  $('#top .home').onclick = () => renderTest(c.key);
  $('#top .title').onclick = () => renderTest(c.key);
  $('#again').onclick = () => {
    if (CH.busy) return toast('답을 쓰는 중입니다');
    if (CH.q) openConv(c.key, CH.q, 'ask'); else if (CH.qtext) openFree(c.key, CH.qtext);
  };
  const nx = $('#nextq');
  if (nx) nx.onclick = () => { if (CH.busy) return toast('답을 쓰는 중입니다'); const q = c.qs[i + 1]; openConv(c.key, q.id, runsOf(c.key, q.id).length ? null : 'ask'); };
  $('#bar').innerHTML = '';
  $('#stage').innerHTML = '<div class="chwrap"><div class="chleft"><div id="chq" class="chq"></div><div id="chlog" class="chlog"></div><form id="chf" class="chf"><textarea id="chin" rows="2" aria-label="이어서 물을 말"></textarea><button class="chsend">보내기</button></form></div><div id="chright" class="chright"></div></div>';
  $('#chf').onsubmit = e => { e.preventDefault(); const t = $('#chin').value; if (CH.busy) return toast('답을 쓰는 중입니다'); $('#chin').value = ''; if (!CH.qtext) CH.qtext = t.trim(); chSend(t); };
  $('#chin').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#chf').requestSubmit(); } };
  sync(online ? (Object.keys(pending).length ? '저장 중' : '') : '서버 끊김 · 이 브라우저에 보관');
  chRender();
}
// 위 띠 — 지금 질문 · 여러 번 물었으면 몇 번째 상담을 볼지 · 아직 안 물었으면 「물어보기」
function chHead() {
  const el = $('#chq'); if (!el) return;
  const runs = CH.q ? runsOf(CH.cat, CH.q) : [];
  const sel = runs.length > 1 ? `<select id="runsel" class="runsel" aria-label="물은 때">${runs.map((r, j) => `<option value="${r.sid}" ${r.sid === CH.sid ? 'selected' : ''}>${j + 1}번째 · ${fmtAt(r.at)}</option>`).join('')}</select>` : '';
  const ask = !CH.sid && !CH.busy && !CH.msgs.length && CH.qtext ? '<button class="chnew ink" id="askq">물어보기</button>' : '';
  el.innerHTML = `<span class="chq-t">${esc(CH.qtext)}</span>${sel}${ask}`;
  el.style.display = CH.qtext ? '' : 'none';
  const s = $('#runsel');
  if (s) s.onchange = () => {
    if (CH.busy) { s.value = CH.sid; return toast('답을 쓰는 중입니다'); }
    CH.sid = +s.value; CH.msgs = []; CH.sel = null; chRender(); chShow(CH, CH.sid);
  };
  const a = $('#askq'); if (a) a.onclick = () => chSend(CH.qtext);
}
// 물은 상담 기록 — 새 상담이 열리는 순간(session 이벤트) 남긴다(답이 끝나기 전에 창을 닫아도 남게)
function addRun(ch) {
  const runs = runsOf(ch.cat, ch.q).filter(r => r.sid !== ch.sid);
  runs.push({ sid: ch.sid, at: Date.now(), ...(ch.q ? {} : { q: ch.qtext.slice(0, 140) }) });
  put(runsKey(ch.cat, ch.q), { runs: runs.slice(ch.q ? -50 : -15) }, true);
}
async function chSend(text) {
  const ch = CH;
  if (!CFG) return toast('상담은 게시본에서만 됩니다');
  if (ch.busy) return toast('답을 쓰는 중입니다');
  if (!text || !text.trim()) return;
  ch.busy = true; ch.live = '';
  ch.msgs.push({ id: 'u' + Date.now(), role: 'user', content: text });
  chRender();
  let err = '';
  try {
    const r = await chCall({ op: 'chat', message: text, device_id: chDevice(), client_msg_uid: 'trace-' + Date.now(), ...(ch.sid ? { session_id: ch.sid } : {}) });
    if (r.status === 401) throw { login: true };
    if (!r.ok || !r.body) { const j = await r.json().catch(() => ({})); throw new Error(j.error || j.message || ('상담 오류 ' + r.status)); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const part of parts) for (const line of part.split('\n')) {
        if (!line.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
        if (ev.type === 'session' && ev.session_id && ev.session_id !== ch.sid) {
          ch.sid = ev.session_id; addRun(ch);
          if (CH === ch && !ch.q) history.replaceState(null, '', `#chat/${ch.cat}/s${ch.sid}`);
        }
        else if (ev.type === 'delta' && ev.text) { ch.live += ev.text; if (CH === ch) chLive(); }
        else if (ev.type === 'progress' && ev.text && !ch.live && CH === ch) { const b = $('#chlive'); if (b) b.innerHTML = `<span class="lead">${esc(ev.text)}</span>`; }
        else if (ev.type === 'error') err = ev.message || '답을 받지 못했습니다';
      }
    }
    if (ch.sid) {
      const msgs = await chTrace(ch.sid);
      ch.msgs = msgs;
      const last = [...msgs].reverse().find(m => m.role === 'assistant');
      ch.sel = last ? last.id : null;
    }
    if (err && CH === ch) toast(err);
  } catch (e) {
    if (e && e.login) { ch.busy = false; return askPw('비밀번호가 맞지 않습니다.'); }
    if (CH === ch) toast(e.message || '오류');
  } finally { ch.busy = false; ch.live = ''; if (CH === ch) chRender(); }
}
function chLive() { const b = $('#chlive'); if (b) { b.innerHTML = mdLite(CH.live); const l = $('#chlog'); l.scrollTop = l.scrollHeight; } }
const fbTag = mid => { const r = A['fb-' + mid]; return fbHas(r) ? `<span class="fbtag fb" id="tag-${mid}">의견</span>` : r && r.ok ? `<span class="fbtag ok" id="tag-${mid}">괜찮음</span>` : `<span id="tag-${mid}"></span>`; };
function chRender() {
  const log = $('#chlog'); if (!log) return;
  chHead();
  log.innerHTML =
    CH.msgs.map(m => m.role === 'user'
      ? `<div class="cm u"><div class="bub u">${esc(m.content || '').replace(/\n/g, '<br>')}</div></div>`
      : `<div class="cm a ${m.id === CH.sel ? 'sel' : ''}" data-id="${m.id}"><div class="bub a">${mdLite(m.content || '')}</div>${fbTag(m.id)}</div>`).join('') +
    (CH.busy ? `<div class="cm a"><div class="bub a" id="chlive">${CH.live ? mdLite(CH.live) : '<span class="lead">답 쓰는 중…</span>'}</div></div>` : '');
  log.querySelectorAll('.cm.a[data-id]').forEach(el => el.onclick = () => {
    CH.sel = +el.dataset.id; chRender();
    if (window.matchMedia('(max-width:820px)').matches) { const r = $('#chright'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  log.scrollTop = log.scrollHeight;
  chDetail();
}
// 판단 기록을 현장 말로 — 영어 칸 이름은 한국어로 바꾸고, 모르는 칸·서버 원문은 「원본 기록(구현 담당용)」에만
const KO = {
  hp: '마력', unit_hp: '마력', selected_hp: '고른 마력', refrigerant: '냉매', sys_ref: '냉매', voltage: '전원', unit_volt: '전원',
  brand: '메이커', unit_comp_brand: '압축기 메이커', compressor_kind: '압축기 종류', unit_comp_kind: '압축기 종류',

    swallow = false;
    if (e.button || e.target.closest('textarea,input,.addin,.tblwrap,.pc[data-x]')) return;
    on = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    card.style.transition = 'none';
  });
  card.addEventListener('pointermove', e => {
    if (!on) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    try { card.setPointerCapture(e.pointerId); } catch {}
    const up = dy < 0 && Math.abs(dy) > Math.abs(dx);
    card.style.transform = up ? `translateY(${Math.min(dy, 0)}px)` : `translateX(${dx}px) rotate(${dx / 24}deg)`;
    lift(Math.min(1, Math.max(Math.abs(dx), up ? -dy : 0) / 140));
    const h = hint();
    const lab = up && dy < -40 ? '↑ 나중에' : dx > 40 ? (deck === 'p' ? '확인 ›' : '다음 ›') : dx < -40 ? '‹ 이전' : '';
    h.textContent = lab; h.style.opacity = lab ? 1 : 0;
  });
  const end = e => {
    if (!on) return; on = false;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) swallow = true;
    const up = dy < 0 && Math.abs(dy) > Math.abs(dx);
    if (e.type !== 'pointercancel' && up && dy < -90) return later();
    if (e.type !== 'pointercancel' && dx > 100) return next();
    if (e.type !== 'pointercancel' && dx < -100) return prev();
    snap(card);
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}
// 카드 안이 넘치면 세로 스크롤을 살리고(위로 밀기는 단추로), 안 넘치면 위로 밀기까지 받는다
function fitTouch(card) { card.style.touchAction = card.scrollHeight > card.clientHeight + 1 ? 'pan-y' : 'none'; }

// 끝 화면
function renderEnd() {
  const L = list(), c = countDeck(deck), open = L.length - c.done - c.later;
  const fl = L.findIndex(x => st(x.id) === 'later');
  $('#stage').innerHTML = `<div class="end">
    <h2>${open ? '여기까지입니다' : '끝까지 봤습니다'}</h2>
    <p>${deck === 'p' ? '확인함' : '답함'} ${c.done} · 나중에 ${c.later}${open ? ` · 안 본 것 ${open}` : ''}</p>
    ${open ? '<button class="wide ink" data-a="open">안 본 것 이어서 보기</button>' : ''}
    ${c.later ? `<button class="wide ${open ? '' : 'ink'}" data-a="later">나중에 ${c.later}장 다시 보기</button>` : ''}
    <button class="wide" data-a="first">처음부터 다시 보기</button>
    <button class="wide" data-a="home">처음 화면</button></div>`;
  $('#bar').innerHTML = `<button class="prev" aria-label="이전">${CHEV}</button>`;
  $('#bar .prev').onclick = prev;
  $('#stage').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'open') go(deck, firstOpen());
    if (a === 'later') go(deck, fl);
    if (a === 'first') go(deck, 0);
    if (a === 'home') go(null);
  });
}

// 묶음 건너뛰기
function openSheet() {
  const L = list(), cur = L[idx] ? section(L[idx]) : '', secs = [];
  L.forEach((c, i) => {
    const s = section(c);
    let o = secs.find(x => x.s === s);
    if (!o) secs.push(o = { s, first: i, open: -1, n: 0, done: 0 });
    o.n++; if (seen(c.id)) o.done++; else if (o.open < 0) o.open = i;
  });
  const sh = $('#sheet');
  $('.in', sh).innerHTML = `<h3>${DECKS[deck].name} · 묶음으로 건너뛰기</h3>` +
    secs.map((o, k) => `<button class="srow ${o.s === cur ? 'cur' : ''}" data-k="${k}">${esc(o.s)}<span>${o.done} / ${o.n}</span></button>`).join('');
  sh.classList.add('open');
  sh.onclick = e => {
    const b = e.target.closest('.srow');
    sh.classList.remove('open');
    if (b) { const o = secs[+b.dataset.k]; go(deck, o.open >= 0 ? o.open : o.first); }
  };
}

let toastT = 0;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z') && D && deck && !e.target.closest('textarea,input')) {
    e.preventDefault(); return undo();
  }
  if (!deck || e.target.closest('textarea,input') || $('#sheet').classList.contains('open')) {
    if (e.key === 'Escape') $('#sheet').classList.remove('open');
    return;
  }
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowUp') { e.preventDefault(); later(); }
  else if (e.key === 'Escape') go(null);
  else if (deck === 'q' && /^[1-9]$/.test(e.key) && list()[idx]) pick(list()[idx], +e.key - 1);
  else if (deck === 'a' && /^[12]$/.test(e.key) && list()[idx]) pick(aQ(list()[idx]), +e.key - 1);
});
window.addEventListener('resize', () => { const c = $('#stage .card'); if (c) fitTouch(c); });

async function start() {
  const lo = readLocal(), local = lo.a || {};
  let server = null;
  if (CFG) $('#stage').innerHTML = '<div class="home-wrap"><h1>지식 검수</h1><p class="lead">불러오는 중…</p></div>';
  try { server = CFG ? await webLoad() : await localLoad(); }
  catch (e) {
    if (e && e.auth) return askPw(PW ? '비밀번호가 맞지 않습니다.' : null);
    online = false;
  }
  if (!server) {
    $('#stage').innerHTML = '<div class="home-wrap"><h1>지식 검수</h1><p class="lead">서버에 닿지 않습니다. 잠시 뒤 다시 열어 주세요.</p></div>';
    return;
  }
  D = server.deck;
  if (server.epoch !== lo.ep) {   // 서버가 초기화된 뒤 처음 — 보관본은 버린다
    EP = server.epoch; A = { ...server.answers };
  } else {
    EP = server.epoch; A = { ...server.answers };
    for (const k in local) if (!A[k] || (local[k].t || 0) > (A[k].t || 0)) { A[k] = local[k]; pending[k] = local[k]; }
  }
  writeLocal();
  if (Object.keys(pending).length) schedule(CFG ? 4000 : 0);
  const m = location.hash.match(/^#([pq])\/(\d+)$/);
  const t = location.hash.match(/^#chat(?:\/([\w-]+)(?:\/([\w-]+))?)?$/);
  if (t) return t[2] ? openConv(t[1], t[2]) : renderTest(t[1]);   // 주소로 열면 묻지 않고 보여만 준다(새로 고침에 또 묻지 않게)
  if (m) go(m[1], Math.min(+m[2], D.decks[m[1]].length)); else if (location.hash === '#guide') go('guide'); else if (location.hash === '#sum') go('sum'); else renderHome();
}
try { PW = localStorage.getItem(LS_PW) || ''; } catch {}
if (CFG && !PW) askPw(); else start();
</script>
