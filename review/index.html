<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지식 검수</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/static/woff2/SUIT.css">
<style>
/* 색·모서리·글꼴은 사장님 지식 정리 웹판(RChatAI 앱 토큰)과 같다 · 본문 17, 14 미만 금지 */
:root{
  --ink:#191F28; --sub:#4E5968; --faint:#8B95A1;
  --bg:#FFFFFF; --soft:#F2F4F6; --line:#E5E8EB; --line2:#D1D6DB;
  --ok:#18A5A5; --ok-soft:#EDF8F8; --warn:#F57800; --warn-soft:#FFF3E0;
  --r-card:16px; --r-ctl:12px;
  --float:0 8px 24px rgba(0,23,51,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--soft);color:var(--ink);font-family:"SUIT","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
textarea,input{font-family:inherit;font-size:17px;color:inherit}
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}

/* 위 띠 */
#top{flex:none;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px}
#top .home{width:40px;height:40px;border-radius:12px;color:var(--sub);display:grid;place-items:center}
#top .title{flex:1;min-width:0;text-align:left;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 4px;border-radius:10px}
#top .title small{font-weight:500;color:var(--faint);font-size:15px;margin-left:6px}
#top .count{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
#sync{font-size:14px;color:var(--faint);min-width:0}

/* 카드 무대 */
#stage{flex:1;position:relative;min-height:0}
.ghost,.card{position:absolute;left:16px;right:16px;top:4px;bottom:28px;border-radius:var(--r-card);background:var(--bg)}
.ghost{box-shadow:0 1px 3px rgba(0,23,51,.06);transform-origin:50% 100%}
.ghost.g1{transform:translateY(12px) scale(.95);opacity:.8;overflow:hidden;pointer-events:none;user-select:none}
.ghost .peek{padding:22px 20px 24px}
.ghost.g2{transform:translateY(24px) scale(.9);opacity:.5}
.card{box-shadow:var(--float);padding:22px 20px 24px;overflow-y:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.card textarea,.card input{user-select:text;-webkit-user-select:text}
.card.enter-left{animation:inL .2s ease}
.card.enter{animation:none}   /* 뒤 카드가 이미 앞자리로 올라와 있어 따로 나타나는 효과 없음 */
@keyframes inL{from{transform:translateX(-60px);opacity:0}}
@keyframes inN{from{transform:scale(.97);opacity:.6}}
.card.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:28px}
.tag{font-size:14px;color:var(--sub);background:var(--soft);border-radius:8px;padding:3px 10px}
.st{margin-left:auto;font-size:14px;font-weight:600;border-radius:8px;padding:3px 10px}
.st.ans,.st.done{color:var(--ok);background:var(--ok-soft)}
.st.later{color:var(--warn);background:var(--warn-soft)}
.qt{font-size:22px;line-height:1.45;font-weight:700;margin:0 0 10px;letter-spacing:-.2px;word-break:keep-all}
.ctx{font-size:15px;color:var(--sub);margin:0 0 18px;word-break:keep-all}

/* 질문 선택지 */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-ctl);text-align:left;background:var(--bg);word-break:keep-all}
.opt .n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--faint);font-size:14px;font-weight:700;display:grid;place-items:center}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.on .n{background:rgba(255,255,255,.18);color:#fff}
.opt .pen{margin-left:auto;font-size:14px;opacity:.6}
.wbtn{margin-top:14px;font-size:15px;color:var(--sub);padding:8px 2px}
.txt{display:block;width:100%;min-height:96px;margin-top:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r-ctl);resize:vertical;line-height:1.5;background:var(--bg)}
.txt:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}

/* 부품 카드 */
.sib{font-size:15px;font-weight:500;color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.galae{display:inline-block;font-size:15px;font-weight:600;color:var(--ink);border:1px solid var(--line2);border-radius:999px;padding:3px 12px;margin:-2px 0 18px}
.sec{font-size:15px;font-weight:700;margin:4px 0 2px}
.hint{font-size:14px;color:var(--faint);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pc{min-height:44px;padding:9px 16px;border-radius:999px;background:var(--soft);color:var(--faint);font-size:16px}
.pc.on{background:var(--ink);color:#fff;font-weight:600}
.pc[data-x]{cursor:grab;touch-action:none;-webkit-touch-callout:none}
.pc.ph{opacity:0}
.pc.lift{position:fixed !important;z-index:60;margin:0;pointer-events:none;cursor:grabbing;transform:scale(1.05);box-shadow:var(--float);transition:transform .12s ease}
body.dragging,body.dragging *{cursor:grabbing !important;user-select:none}
.pc.add{background:var(--bg);border:1.5px dashed var(--line2);color:var(--sub)}
.pc[data-x]{position:relative}
.pc .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--sub);color:#fff;font-size:15px;line-height:21px;text-align:center;font-weight:600;display:none;box-shadow:0 0 0 2px var(--bg)}
.pc .x:hover{background:var(--ink)}
@media (hover:hover){ .pc[data-x]:hover .x{display:block} }
@media (hover:none){ .pc .x{display:block;width:20px;height:20px;line-height:19px;font-size:14px;opacity:.75} }
body.dragging .pc .x,.pc.lift .x{display:none}
.chips .add{align-self:center}
.tile.guide{background:var(--ink);color:#fff}
.tile.guide span{color:rgba(255,255,255,.75)}
.tile .step{display:block;font-style:normal;font-size:14px;font-weight:600;color:var(--ok);margin-top:8px}
.tag.boss{color:var(--warn);background:var(--warn-soft)}
.when{font-size:14px;color:var(--faint)}
.who{font-size:14px;color:var(--faint);margin:12px 2px 4px}
.bub{border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.bub.u{background:var(--soft)}
.bub.a{border:1px solid var(--line)}
.bub.sm{font-size:15px;padding:10px 12px;color:var(--sub)}
.bub p{margin:0}
.bub .gap{height:8px}
.tblwrap{overflow-x:auto;margin:8px 0}
.bub table{border-collapse:collapse;font-size:14px;min-width:100%}
.bub th,.bub td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.bub th{color:var(--sub);font-weight:600}
.prevbtn{font-size:15px;color:var(--sub);padding:6px 0}
.prevlog{border-left:3px solid var(--line);padding-left:10px;margin:2px 0 8px}
.opts.two{flex-direction:row}
.opts.two .opt{flex:1}
.pc small{font-size:14px;opacity:.65;margin-right:5px}
.guide-wrap{padding:4px 16px 32px;overflow-y:auto;height:100%}
.guide-wrap h2{font-size:20px;margin:32px 0 6px;letter-spacing:-.2px}
.guide-wrap .lead{color:var(--sub);font-size:15px;margin:0 0 16px}
.flow{display:flex;flex-direction:column}
.io{align-self:center;background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:16px}
.io small{font-weight:400;opacity:.7;margin-left:8px;font-size:14px}
.arrow{width:2px;height:20px;background:var(--line2);margin:0 auto;position:relative}
.arrow:after{content:'';position:absolute;bottom:-2px;left:-4px;border:5px solid transparent;border-top-color:var(--line2);border-bottom:0}
.stepbox{display:flex;gap:12px;background:var(--bg);border-radius:var(--r-card);padding:16px;box-shadow:0 1px 3px rgba(0,23,51,.06)}
.stepbox .no{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:700}
.stepbox b{font-size:17px}
.stepbox p{margin:4px 0 0;font-size:15px;color:var(--sub);word-break:keep-all}
.stepbox .base{color:var(--faint);font-size:14px}
.who2{font-size:14px;color:var(--faint)}
.dk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dk span{font-size:14px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:3px 10px}
.loop{background:var(--bg);border-radius:var(--r-card);padding:4px 16px}
.lp{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lp:last-child{border-bottom:0}
.lp .who3{flex:none;width:76px;font-size:14px;font-weight:700;padding-top:2px}
.lp p{margin:0;font-size:15px;word-break:keep-all}
.mrow{background:var(--bg);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.mrow .to{color:var(--ok);font-weight:600;font-size:15px;margin-top:2px}
.mrow p{margin:4px 0 0;font-size:15px;color:var(--sub);word-break:keep-all}
.mrow .warn{color:var(--warn)}
.guide-wrap .wide{background:var(--bg)}
.undo{width:40px;height:40px;border-radius:12px;color:var(--sub);display:grid;place-items:center;flex:none}
.undo:disabled{opacity:.3;cursor:default}
.pwin{display:block;width:100%;height:54px;padding:0 16px;border:1px solid var(--line2);border-radius:var(--r-ctl);font-size:17px;background:var(--bg)}
.pwin:focus{outline:2px solid var(--ink);outline-offset:-1px}
body.wide #app{max-width:1240px}
.chnew{font-size:15px;color:var(--sub);background:var(--bg);border-radius:10px;padding:8px 12px;flex:none}
.chwrap{display:flex;gap:14px;height:100%;padding:0 16px 14px}
.chleft{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);border-radius:var(--r-card)}
.chlog{flex:1;overflow-y:auto;padding:12px 14px}
.cm{display:flex;margin:8px 0}
.cm.u{justify-content:flex-end}
.cm .bub{max-width:88%}
.cm.a .bub{cursor:pointer}
.cm.a.sel .bub{border:2px solid var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.chf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chf textarea{flex:1;resize:none;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:16px}
.chsend{background:var(--ink);color:#fff;border-radius:12px;padding:0 18px;font-weight:600}
.chright{flex:1.1;overflow-y:auto;min-width:0}
.dsec{background:var(--bg);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px}
.dsec h3{font-size:16px;margin:0 0 8px}
.dsub{font-size:15px;font-weight:700;margin:10px 0 4px}
.dsrc{font-size:14px;color:var(--faint);margin:4px 0}
.dkv{border-collapse:collapse;width:100%;font-size:14px}
.dkv th{text-align:left;color:var(--sub);font-weight:500;padding:4px 8px 4px 0;white-space:nowrap;vertical-align:top;width:1%}
.dkv td{padding:4px 0;word-break:break-all}
.dtool{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.dtool:first-of-type{border-top:0}
.dtbl{border-collapse:collapse;font-size:14px;min-width:100%}
.dtbl th,.dtbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.dpre{white-space:pre-wrap;word-break:break-all;font-size:13px;background:var(--soft);padding:10px;border-radius:10px;max-height:320px;overflow:auto}
.dul{margin:0;padding-left:18px;font-size:14px}
details summary{cursor:pointer;font-size:14px;color:var(--sub);margin:6px 0}
@media (max-width:820px){ .chwrap{flex-direction:column;overflow-y:auto} .chleft{min-height:60vh} .chright{flex:none} }
.sumlink{display:block;margin:28px auto 0;font-size:15px;color:var(--sub);text-decoration:underline;padding:8px}
.sumstat{display:flex;gap:10px;margin:8px 0 14px}
.sumstat div{flex:1;background:var(--bg);border-radius:12px;padding:12px 14px}
.sumstat b{display:block;font-size:22px}
.sumstat span{font-size:14px;color:var(--sub)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;height:40px;border-radius:10px;font-size:15px;color:var(--sub)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:700}
.dl{display:flex;gap:10px;margin-top:6px}
.dl span{flex:none;width:52px;font-size:14px;color:var(--faint);padding-top:1px}
.dl p{margin:0 !important;color:var(--ink) !important;font-size:15px;word-break:keep-all}
.addin{min-height:44px;width:150px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--ink);outline:0}

/* 밀 때 보이는 글 */
.drag{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:5;font-size:15px;font-weight:700;padding:5px 14px;border-radius:999px;background:var(--ink);color:#fff;opacity:0;pointer-events:none;transition:opacity .1s}

/* 아래 띠 */
#bar{flex:none;display:flex;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
#bar button{height:54px;border-radius:var(--r-ctl);font-weight:600}
#bar .prev{width:64px;background:var(--bg);color:var(--sub);display:grid;place-items:center}
#bar .later{flex:1;background:var(--bg);color:var(--sub)}
#bar .next{flex:1.6;background:var(--ink);color:#fff}
#bar button:disabled{opacity:.35;cursor:default}

/* 홈 */
.home-wrap{padding:28px 16px 24px;overflow-y:auto;height:100%}
.home-wrap h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px}
.home-wrap .lead{color:var(--sub);margin:0 0 24px;font-size:15px}
.tile{display:block;width:100%;text-align:left;background:var(--bg);border-radius:var(--r-card);padding:22px 20px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,23,51,.06)}
.tile b{display:block;font-size:20px}
.tile span{display:block;color:var(--sub);font-size:15px;margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--soft);margin:16px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.tile .nums{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.how{margin-top:20px;font-size:15px;color:var(--sub);line-height:1.8}
.how b{color:var(--ink)}

/* 끝 화면 · 건너뛰기 목록 */
.end{position:absolute;left:16px;right:16px;top:4px;bottom:22px;background:var(--bg);border-radius:var(--r-card);padding:32px 20px;box-shadow:var(--float);overflow-y:auto}
.end h2{font-size:22px;margin:0 0 8px}
.end p{color:var(--sub);margin:0 0 24px}
.wide{display:block;width:100%;min-height:54px;border-radius:var(--r-ctl);background:var(--soft);font-weight:600;margin-bottom:10px}
.wide.ink{background:var(--ink);color:#fff}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
#sheet.open{display:block}
#sheet .in{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:75vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet h3{font-size:17px;margin:0 0 10px}
.srow{display:flex;width:100%;align-items:center;min-height:52px;padding:0 6px;border-bottom:1px solid var(--line);text-align:left}
.srow span{margin-left:auto;color:var(--faint);font-size:15px;font-variant-numeric:tabular-nums}
.srow.cur{font-weight:700}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:15px;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>

//     창을 닫거나 다른 탭으로 가면 기다리지 않고 그 자리에서 보낸다(대표 10/26 「수정되면 바로바로 서버에」).
const CFG = window.CFG || null;
const LS_PW = 'jh-review-pw';
let PW = '', lastSave = 0, lastLoad = 0, HIST = [];
function readLocal() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; } }

function put(id, patch, noHist) {
  if (!noHist) remember(id, Object.keys(patch));
  A[id] = { ...(A[id] || {}), ...patch, t: Date.now() };
  pending[id] = A[id];
  writeLocal();
  schedule();
  sync('저장 중');
}
function schedule(ms) {
  clearTimeout(flushT);
  flushT = setTimeout(flush, ms ?? (CFG ? Math.max(300, lastSave + 7000 - Date.now()) : 300));
}
let flushing = false;
async function flush(now) {

  flushing = true;
  try { await flushSend(send, now); } finally { flushing = false; }
}
// 창을 닫거나 다른 탭으로 갈 때 — 남은 것을 바로 보낸다(keepalive: 창이 닫혀도 요청은 간다)
function flushNow() { if (Object.keys(pending).length) { clearTimeout(flushT); flush(true); } }
window.addEventListener('pagehide', flushNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushNow(); });
async function flushSend(send, now) {
  if (!Object.keys(send).length) return;
  try {
    const res = CFG ? await webSave(send, now) : await localSave(send, now);
    if (res.reset) {   // 서버 답이 초기화됨 — 이 브라우저 답도 서버 판으로
      EP = res.epoch; A = res.answers; pending = {}; HIST = []; writeLocal();
      toast('서버 답이 초기화되어 새로 불러왔습니다');
      return deck ? go(deck, 0) : renderHome();
    }
    if (res.answers && adopt(res.answers) && deck && list()[idx]) rerender();   // 다른 기기에서 고친 것
    online = true; sync('저장됨');
  } catch (e) {
    for (const k in send) if (!pending[k]) pending[k] = send[k];
    if (e && e.auth) return askPw('비밀번호가 바뀌었습니다. 다시 넣어 주세요.');
    online = false; sync('서버 끊김 · 이 브라우저에 보관');
    schedule(e && e.retry ? e.retry * 1000 : (CFG ? 15000 : 5000));
  }
}
function adopt(sv) {
  let ch = false;
  for (const k in sv) if (!pending[k] && (sv[k].t || 0) > ((A[k] || {}).t || 0)) { A[k] = sv[k]; ch = true; }
  if (ch) writeLocal();
  return ch;
}
function sync(t) { const el = $('#sync'); if (el) el.textContent = t; }

// 로컬
async function localLoad() {
  const deckData = await (await fetch('deck.json')).json();
  const r = await fetch('api/answers'); if (!r.ok) throw new Error(r.status);
  const sv = await r.json();
  return { deck: deckData, epoch: sv.epoch, answers: sv.answers };
}
async function localSave(send, keepalive) {
  const r = await fetch('api/answers', { method: 'POST', keepalive: !!keepalive, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ epoch: EP, answers: send }) });
  if (r.status === 409) { const sv = await r.json(); return { reset: true, epoch: sv.epoch, answers: sv.answers }; }
  if (!r.ok) throw new Error(r.status);
  return {};
}

// 게시본 — 답 노드에 초기화 번호(ep)를 같이 적어, 초기화 전 브라우저가 늦게 보낸 답은 읽을 때 버린다
async function mm(body, keepalive) {
  const r = await fetch(CFG.fn, {
    method: 'POST', keepalive: !!keepalive,
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ pw: PW, ns: 'v3', ...body }),
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw { auth: true };
  if (r.status === 429) throw { retry: +(r.headers.get('Retry-After') || 30) };
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function readAnswers(nodes) {
  let ep = '0';
  if (nodes && nodes.meta && !nodes.meta.d) { try { ep = JSON.parse(nodes.meta.x).epoch || '0'; } catch {} }
  const a = {};
  for (const [id, n] of Object.entries(nodes || {})) {
    if (n.d || id === 'meta') continue;
    try { const rec = JSON.parse(n.x); if ((rec.ep || '0') === ep) { delete rec.ep; a[id] = rec; } } catch {}
  }
  return { ep, a };
}
async function webLoad() {
  const dd = (await mm({ op: 'load', cate: CFG.dataCate })).doc;
  if (!dd || !dd.nodes['d-meta']) throw new Error('카드 자료 없음');
  const meta = JSON.parse(dd.nodes['d-meta'].x);
  let text = '';
  for (let i = 0; i < meta.n; i++) text += dd.nodes['d-' + String(i).padStart(4, '0')].x;
  const ad = (await mm({ op: 'load', cate: CFG.ansCate })).doc;
  const { ep, a } = readAnswers(ad && ad.nodes);
  lastLoad = Date.now();
  return { deck: JSON.parse(text), epoch: ep, answers: a };
}
async function webSave(send, keepalive) {
  const nodes = {};
  for (const [id, rec] of Object.entries(send)) nodes[id] = { p: '', t: 'a', x: JSON.stringify({ ...rec, ep: EP }), u: rec.t || Date.now(), o: 0 };
  lastSave = Date.now();
  const doc = (await mm({ op: 'save', cate: CFG.ansCate, doc: { cate: CFG.ansCate, name: '재현 지식 검수 답', nodes } }, keepalive)).doc;
  const { ep, a } = readAnswers(doc.nodes);
  return ep !== EP ? { reset: true, epoch: ep, answers: a } : { answers: a };
}
// 다른 기기에서 고친 답 받기 — 창으로 돌아왔을 때, 1분에 한 번까지
document.addEventListener('visibilitychange', async () => {
  if (!CFG || document.hidden || !D || Date.now() - lastLoad < 60000 || Object.keys(pending).length) return;
  lastLoad = Date.now();
  try {
    const { ep, a } = readAnswers(((await mm({ op: 'load', cate: CFG.ansCate })).doc || {}).nodes);
    if (ep !== EP) { EP = ep; A = a; HIST = []; writeLocal(); toast('서버 답이 초기화되어 새로 불러왔습니다'); return deck ? go(deck, 0) : renderHome(); }
    if (adopt(a) && deck && list()[idx]) rerender();

});

// ── 되돌리기 — 바꾸기 전 답을 쌓아 두고 하나씩 되돌린다(같은 카드·같은 칸을 1.5초 안에 이어 고치면 한 번으로)

  const k = keys.slice().sort().join(','), last = HIST[HIST.length - 1], now = Date.now();
  if (last && last.id === id && last.k === k && now - last.at < 1500) { last.at = now; return; }

  writeLocal(); schedule(); sync('저장 중');
  toast('되돌렸습니다');
  for (const k of ORDER) {

const UNDO_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>';

// ── 덱 도우미 ──

}

// ── 화면 ──
function go(k, i) {

  if (k === 'sum') return renderSummary();

  history.replaceState(null, '', `#${k}/${idx}`);

// 질문 카드
function qCard(c) {

      <button class="opt ${ch.includes(i) ? 'on' : ''}" data-i="${i}"><span class="n">${c.multi ? (ch.includes(i) ? '✓' : '') : i + 1}</span><span>${esc(optLabel(o))}</span>${isW(o) ? '<span class="pen">✎</span>' : ''}</button>`).join('')}</div>` : ''}
    ${c.opts.length && !wOpen ? '<button class="wbtn">✎ 직접 적기</button>' : ''}
    ${wOpen ? `<textarea class="txt" maxlength="1500" placeholder="${c.opts.length ? '덧붙일 말이나 맞는 답을 적어 주세요' : '여기에 적어 주세요'}">${esc(r.text || '')}</textarea>` : ''}`;
}

}

// 부품 카드
//   기록: items(지금 칩 목록) · on(켜진 칩) · add(새로 더한 칩) · ren({원래 이름: 새 이름}) · del(뺀 원래 칩) · memo
const pItems = c => (A[c.id] || {}).items || c.items;
function pOn(c) { return new Set((A[c.id] || {}).on || c.sel); }
const origOf = (r, name) => Object.keys(r.ren || {}).find(k => r.ren[k] === name) ?? name;

function chipRename(c, old, nw) {
  nw = nw.trim();

  if (!nw) { chipRemove(c, old); return true; }
  const r = A[c.id] || {}, on = pOn(c), had = on.has(old), merge = pItems(c).includes(nw);
  const items = merge ? pItems(c).filter(x => x !== old) : pItems(c).map(x => x === old ? nw : x);
  on.delete(old); if (had) on.add(nw);
  let add = r.add || [], ren = { ...(r.ren || {}) };
  if (add.includes(old)) add = [...new Set(add.map(x => x === old ? nw : x))];
  else ren[origOf(r, old)] = nw;
  pSave(c, items, on, { add, ren });
  return merge;   // 같은 이름 칩과 합쳐졌으면 다시 그려야 한다
}
function chipRemove(c, name) {
  const r = A[c.id] || {}, on = pOn(c);
  on.delete(name);
  const extra = (r.add || []).includes(name)
    ? { add: r.add.filter(x => x !== name) }
    : { del: [...new Set([...(r.del || []), origOf(r, name)])] };
  pSave(c, pItems(c).filter(x => x !== name), on, extra);
}
function chipRenameStart(card, c, b) {
  const old = b.dataset.x, inp = document.createElement('input');
  inp.className = 'addin'; inp.value = old; inp.style.width = chipW(old) + 1.4 + 'em';
  b.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    if (save) chipRename(c, old, inp.value);   // 다 지우면 빠진다 · 같은 이름이면 합쳐진다
    rerender();
  };
  inp.oninput = () => { inp.style.width = chipW(inp.value) + 1.4 + 'em'; };
  inp.onkeydown = ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
    if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
  };
  inp.onblur = () => finish(true);
}
function pCard(c) {
  const r = A[c.id] || {}, on = pOn(c), all = pItems(c);
  const ask = c.kind === 'ask';
  const sib = list().filter(x => x.type === c.type);   // 같은 부품 카드는 이어서 나온다 — 그 안에서 몇 번째인지
  // 칩 모서리의 × = 빼기(컴퓨터는 마우스를 올리면, 폰은 늘 보임) · 두 번 빠르게 누르면 이름 고치기
  const chips = all.map(x => `<button class="pc ${on.has(x) ? 'on' : ''}" data-x="${esc(x)}">${esc(x)}<span class="x" aria-label="빼기">×</span></button>`).join('');
  return `<div class="meta"><span class="tag">${esc(c.group)}</span>${c.boss ? '<span class="tag boss">사장님 답</span>' : ''}${badge(c.id)}</div>
    <h2 class="qt">${esc(c.name)}${sib.length > 1 ? ` <span class="sib">${sib.indexOf(c) + 1} / ${sib.length}</span>` : ''}</h2>
    ${c.galae ? `<span class="galae">${esc(c.galae)}</span>` : ''}
    <div class="sec">${ask ? '손님께 묻는 항목' : '같이 권하는 부속'}</div>
    <p class="hint">${ask ? '켜진 항목만 손님께 묻습니다' : '켜진 부속은 「○○는 필요 없으세요?」 하고 묻습니다'} · 끌어서 순서 바꾸기 · 두 번 눌러 이름 고치기</p>

  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(x => x.trim());
  let out = '', tbl = null;
  const flushT = () => {
    if (!tbl) return;
    out += `<div class="tblwrap"><table>${tbl.map((r, i) => `<tr>${r.map(x => i ? `<td>${inline(x)}</td>` : `<th>${inline(x)}</th>`).join('')}</tr>`).join('')}</table></div>`;
    tbl = null;

  for (const l of String(t || '').split('\n')) {

}

function partDiff(c) {
  const r = A[c.id] || {}, ren = r.ren || {}, del = new Set(r.del || []), add = r.add || [];
  const map = x => ren[x] ?? x;
  const baseOn = new Set(c.sel.filter(x => !del.has(x)).map(map));
  const cur = pItems(c), on = pOn(c);
  const turnedOn = cur.filter(x => on.has(x) && !baseOn.has(x) && !add.includes(x));
  const turnedOff = cur.filter(x => !on.has(x) && baseOn.has(x));
  const baseOrder = c.items.filter(x => !del.has(x)).map(map);
  const reordered = !!r.items && cur.filter(x => !add.includes(x)).join('|') !== baseOrder.filter(x => cur.includes(x)).join('|');
  const d = {
    on: turnedOn, off: turnedOff, add: add.map(x => x + (on.has(x) ? '' : '(꺼짐)')),
    ren: Object.entries(ren).map(([a, b]) => `${a} → ${b}`), del: [...del],
    order: reordered ? cur.join(' · ') : '', memo: (r.memo || '').trim(),

  d.changed = !!(d.on.length || d.off.length || d.add.length || d.ren.length || d.del.length || d.order || d.memo);

}

function bindSwipe(card) {

    const lab = up && dy < -40 ? '↑ 나중에' : dx > 40 ? (deck === 'p' ? '확인 ›' : '다음 ›') : dx < -40 ? '‹ 이전' : '';

  $('#stage').innerHTML = `<div class="end">
    <h2>${open ? '여기까지입니다' : '끝까지 봤습니다'}</h2>
    <p>${deck === 'p' ? '확인함' : '답함'} ${c.done} · 나중에 ${c.later}${open ? ` · 안 본 것 ${open}` : ''}</p>
    ${open ? '<button class="wide ink" data-a="open">안 본 것 이어서 보기</button>' : ''}
    ${c.later ? `<button class="wide ${open ? '' : 'ink'}" data-a="later">나중에 ${c.later}장 다시 보기</button>` : ''}
    <button class="wide" data-a="first">처음부터 다시 보기</button>
    <button class="wide" data-a="home">처음 화면</button></div>`;
  $('#bar').innerHTML = `<button class="prev" aria-label="이전">${CHEV}</button>`;
  $('#bar .prev').onclick = prev;
  $('#stage').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'open') go(deck, firstOpen());
    if (a === 'later') go(deck, fl);
    if (a === 'first') go(deck, 0);
    if (a === 'home') go(null);
  });
}

// 묶음 건너뛰기
function openSheet() {
  const L = list(), cur = L[idx] ? section(L[idx]) : '', secs = [];
  L.forEach((c, i) => {
    const s = section(c);
    let o = secs.find(x => x.s === s);
    if (!o) secs.push(o = { s, first: i, open: -1, n: 0, done: 0 });
    o.n++; if (seen(c.id)) o.done++; else if (o.open < 0) o.open = i;
  });
  const sh = $('#sheet');
  $('.in', sh).innerHTML = `<h3>${DECKS[deck].name} · 묶음으로 건너뛰기</h3>` +
    secs.map((o, k) => `<button class="srow ${o.s === cur ? 'cur' : ''}" data-k="${k}">${esc(o.s)}<span>${o.done} / ${o.n}</span></button>`).join('');
  sh.classList.add('open');
  sh.onclick = e => {
    const b = e.target.closest('.srow');
    sh.classList.remove('open');
    if (b) { const o = secs[+b.dataset.k]; go(deck, o.open >= 0 ? o.open : o.first); }
  };
}

let toastT = 0;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z') && D && !e.target.closest('textarea,input')) {
    e.preventDefault(); return undo();
  }
  if (!deck || e.target.closest('textarea,input') || $('#sheet').classList.contains('open')) {
    if (e.key === 'Escape') $('#sheet').classList.remove('open');
    return;
  }
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowUp') { e.preventDefault(); later(); }
  else if (e.key === 'Escape') go(null);
  else if (deck === 'q' && /^[1-9]$/.test(e.key) && list()[idx]) pick(list()[idx], +e.key - 1);
  else if (deck === 'a' && /^[12]$/.test(e.key) && list()[idx]) pick(aQ(list()[idx]), +e.key - 1);
});
window.addEventListener('resize', () => { const c = $('#stage .card'); if (c) fitTouch(c); });

async function start() {
  const lo = readLocal(), local = lo.a || {};
  let server = null;
  if (CFG) $('#stage').innerHTML = '<div class="home-wrap"><h1>지식 검수</h1><p class="lead">불러오는 중…</p></div>';
  try { server = CFG ? await webLoad() : await localLoad(); }
  catch (e) {
    if (e && e.auth) return askPw(PW ? '비밀번호가 맞지 않습니다.' : null);
    online = false;
  }
  if (!server) {
    $('#stage').innerHTML = '<div class="home-wrap"><h1>지식 검수</h1><p class="lead">서버에 닿지 않습니다. 잠시 뒤 다시 열어 주세요.</p></div>';
    return;
  }
  D = server.deck;
  if (server.epoch !== lo.ep) {   // 서버가 초기화된 뒤 처음 — 보관본은 버린다
    EP = server.epoch; A = { ...server.answers };
  } else {
    EP = server.epoch; A = { ...server.answers };
    for (const k in local) if (!A[k] || (local[k].t || 0) > (A[k].t || 0)) { A[k] = local[k]; pending[k] = local[k]; }
  }
  writeLocal();
  if (Object.keys(pending).length) schedule(CFG ? 4000 : 0);
  const m = location.hash.match(/^#([pq])\/(\d+)$/);
  if (m) go(m[1], Math.min(+m[2], D.decks[m[1]].length)); else if (location.hash === '#guide') go('guide'); else if (location.hash === '#sum') go('sum'); else if (location.hash === '#chat') go('chat'); else renderHome();
}
try { PW = localStorage.getItem(LS_PW) || ''; } catch {}
if (location.hash === '#chat') renderChat(); else if (CFG && !PW) askPw(); else start();   // 상담 테스트는 카드 자료 없이 열린다
</script>
