<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부품 상담 지식 정리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/static/woff2/SUIT.css">
<style>
/* RChatAI 앱 디자인 토큰(app/src/lib/theme.ts — 토스 디자인 시스템 기준)을 그대로 옮김 (2026-10-21 대표 「rchatai 스타일로」)
   주색 = 잉크 검정 · 옅은 면 = grey100 · 선 = grey200 · 모서리 카드 16 / 컨트롤 12 · 글꼴 SUIT · 본문 17, 14 미만 금지 */
:root{
  --ink:#191F28; --ink-press:#000; --sub:#4E5968; --faint:#8B95A1;
  --bg:#FFFFFF; --soft:#F2F4F6; --line:#E5E8EB; --line2:#D1D6DB;
  --ok:#18A5A5; --ok-soft:#EDF8F8; --warn:#F57800; --warn-soft:#FFF3E0; --err:#F04452; --err-soft:#FFEEEE;
  --r-card:16px; --r-ctl:12px; --r-sm:10px;
  --shadow:0 1px 3px rgba(0,23,51,.06); --float:0 8px 24px rgba(0,23,51,.10);
  /* 옛 이름 — 동작부 코드가 쓰는 자리 */
  --panel:#FFFFFF; --accent:#191F28; --accent-soft:#F2F4F6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"SUIT","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
textarea,input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* 위 띠 */
#top{position:sticky;top:0;z-index:5;height:64px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
#top h1{font-size:20px;margin:0;font-weight:700;white-space:nowrap;letter-spacing:-.2px}
.progress{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sub);white-space:nowrap;font-weight:600}
.progress .bar{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.st{font-size:14px;color:var(--sub);white-space:nowrap;background:var(--soft);border-radius:999px;padding:3px 12px;font-weight:600}
.st:empty{display:none}
.st.bad{color:var(--err);background:var(--err-soft)}
#label{font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 12px;font-weight:600}
.spacer{flex:1}
.plain{background:var(--soft);border:0;border-radius:var(--r-sm);padding:9px 16px;font-size:15px;font-weight:600;color:var(--sub)}
.plain:hover{background:var(--line)}
.tabs{display:flex;background:var(--soft);border-radius:var(--r-sm);padding:3px}
.tabs button{background:none;border:0;border-radius:8px;padding:6px 14px;font-size:15px;color:var(--sub)}
.tabs button.on{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

/* 틀 */
#wrap{display:flex;align-items:flex-start}
#side{width:264px;flex:0 0 264px;background:var(--bg);border-right:1px solid var(--line);height:calc(100vh - 64px);overflow-y:auto;position:sticky;top:64px;display:flex;flex-direction:column}
#side .find{padding:16px 12px 8px}
#side .find input{width:100%;height:44px;padding:0 14px;border:1px solid transparent;border-radius:var(--r-ctl);background:var(--soft);font-size:16px}
#side .find input:focus{outline:none;border-color:var(--ink);background:var(--bg)}
#side .find input::placeholder{color:var(--faint)}
#tree{padding:4px 8px 8px;flex:1}
#tree .none{padding:14px 12px;font-size:14px;color:var(--faint)}
.hp,.gr,.ty{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;border-radius:var(--r-sm);padding:11px 12px;font-size:16px;margin:1px 0;color:var(--ink)}
.hp{color:var(--sub);font-weight:600;margin-bottom:8px;position:relative}
.hp::after{content:'';position:absolute;left:12px;right:12px;bottom:-5px;height:1px;background:var(--line)}
.hp:hover,.gr:hover,.ty:hover{background:var(--soft)}
.hp.cur,.gr.cur,.ty.cur{background:var(--soft);font-weight:700;color:var(--ink)}
.gr small,.ty small{color:var(--faint);font-weight:500;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gr small.all,.ty small{color:var(--ok);font-weight:700}
.sidefoot{padding:14px 20px 20px;font-size:14px;color:var(--faint);border-top:1px solid var(--line)}
.sidefoot label{cursor:pointer;color:var(--sub);font-weight:600}
.sidefoot label:hover{color:var(--ink)}
#main{flex:1;min-width:0;padding:32px 40px 40px;max-width:1080px}

/* 카테고리 머리 */
.ch{display:flex;align-items:baseline;gap:12px;margin:0 0 6px;flex-wrap:wrap}
.ch h2{font-size:26px;margin:0;font-weight:700;letter-spacing:-.3px}
.ch .gp{color:var(--faint);font-size:15px;font-weight:600}
.ch .ok{color:var(--ok);font-size:15px;font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
.cat{border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:15px;font-weight:600;background:var(--bg);color:var(--sub);line-height:1.4}
.cat:hover{border-color:var(--line2);color:var(--ink)}
.cat.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;color:var(--ink);font-weight:700}
.cat b{color:var(--ok);margin-left:6px;font-weight:700}
.cat.add{border-style:dashed;border-color:var(--line2);color:var(--faint)}
.cat .cx{margin-left:8px;padding:0 3px;color:var(--faint);font-weight:400;font-size:14px;border-radius:6px}
.cat .cx::after{content:'✕'}
.cat .cx:hover{color:var(--err);background:var(--err-soft)}
.catin{border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink)}
.catin:focus{outline:none;box-shadow:0 0 0 3px var(--soft)}
.cats .edhint{align-self:center}

/* 칸(필수 항목 · 부속품 · 메모) = 카드 */
.sec{margin:20px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);padding:4px 20px 8px;box-shadow:var(--shadow)}
.sh{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--ink);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.sh .hint{font-weight:500;color:var(--faint);font-size:14px}
.sh .add{margin-left:auto;font-size:14px;font-weight:600;color:var(--sub);background:var(--soft);border:0;border-radius:var(--r-sm);padding:6px 12px}
.sh .add:hover{background:var(--line);color:var(--ink)}
.sh .saved{margin-left:auto;font-weight:600;font-size:14px;color:var(--ok)}
.row{display:flex;gap:16px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--soft)}
.sec .row:last-child{border-bottom:0}
.rl{flex:0 0 168px;font-size:15px;color:var(--sub);padding-top:6px;font-weight:600}
.rc{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.lab{background:none;border:0;border-radius:8px;padding:4px 8px;margin:-4px -8px;font-size:15px;font-weight:600;color:var(--sub);text-align:left;cursor:text;width:calc(100% + 16px)}
.lab:hover{background:var(--soft);color:var(--ink)}
.lab i{color:var(--faint);font-style:normal;font-weight:500}
.labin{width:100%;font-size:15px;padding:5px 10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--bg)}
.labin:focus{outline:none}
.rq{font-size:15px;color:var(--faint);padding:6px 0}
.rx{flex:0 0 auto;display:flex;gap:2px;align-items:center;padding-top:2px}
.mini{background:none;border:0;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--faint)}
.mini:hover{background:var(--soft);color:var(--ink)}
.mini.del{color:var(--err);background:var(--err-soft);margin:0 6px 0 0}
.rx .mini[data-rowdel]:hover{color:var(--err);background:var(--err-soft)}
.row.drop .tg{opacity:.35;text-decoration:line-through;pointer-events:none}
.row.drop .lab{text-decoration:line-through;pointer-events:none}

/* 칩 — 켜짐 = 잉크 채움, 꺼짐 = 옅은 면, 더하기 = 점선 */
.tg{border:1px solid transparent;border-radius:999px;padding:6px 14px;margin:0;font-size:16px;line-height:1.4;background:var(--soft);color:var(--sub);font-weight:500;transition:background .12s,color .12s}
.tg:hover{background:var(--line);color:var(--ink)}
.tg.on{background:var(--ink);color:#fff;font-weight:600}
.tg.on:hover{background:#333D4B}
.tg.add{background:var(--bg);border:1px dashed var(--line2);color:var(--faint)}
.tg.add:hover{border-color:var(--sub);color:var(--ink)}
.tgin{border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;margin:0;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
.tgin.on{font-weight:600}
.tgin:focus{outline:none;box-shadow:0 0 0 3px var(--soft)}
.edhint{font-size:14px;color:var(--faint);align-self:center;white-space:nowrap}
.tg[data-cid]{cursor:grab;touch-action:manipulation}
.tg.ph{opacity:0}
.tg.ghost{position:fixed;z-index:60;margin:0;pointer-events:none;cursor:grabbing;transform:scale(1.05);box-shadow:var(--float);transition:transform .12s ease}
body.dragging,body.dragging *{cursor:grabbing !important;user-select:none}
.addbox{margin:10px 0 6px 184px;display:flex;gap:8px;align-items:center}
.addbox input{flex:1;height:44px;border:1.5px solid var(--ink);border-radius:var(--r-ctl);padding:0 14px;background:var(--bg);font-size:16px}
.addbox input:focus{outline:none}

/* 메모 */
.memo textarea{display:block;width:100%;min-height:72px;margin:12px 0 8px;border:1px solid transparent;border-radius:var(--r-ctl);padding:12px 14px;resize:vertical;background:var(--soft);font:inherit;font-size:16px;line-height:1.55;color:var(--ink)}
.memo textarea:focus{border-color:var(--ink);background:var(--bg);outline:none}
.memo textarea::placeholder{color:var(--faint)}

/* 버튼 · 아래 띠 */
.btn{background:var(--soft);border:0;border-radius:var(--r-ctl);height:48px;padding:0 18px;font-size:16px;font-weight:600;color:var(--ink)}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--ink);color:#fff;font-weight:700;padding:0 22px}
.btn.pri:hover{background:var(--ink-press)}
.btn:disabled{opacity:.4;cursor:default}
.foot2{position:sticky;bottom:0;z-index:4;display:flex;align-items:center;gap:8px;margin:24px -40px 0;padding:12px 40px 16px;background:var(--bg);border-top:1px solid var(--line)}
.foot2 .pos{margin:0 auto;color:var(--faint);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:var(--r-ctl);font-size:15px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;box-shadow:var(--float)}
.toast.on{opacity:.96}

/* 사용법 */
.hlead{font-size:17px;margin:12px 0 20px;max-width:820px;color:var(--sub);line-height:1.7}
.hlead b{color:var(--ink)}
.hs{display:flex;gap:16px;padding:20px 22px;margin:0 0 12px;border:1px solid var(--line);border-radius:var(--r-card);max-width:880px;box-shadow:var(--shadow)}
.hn{flex:0 0 32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.hb h3{margin:3px 0 8px;font-size:18px;font-weight:700}
.hb p{margin:6px 0;font-size:16px;color:var(--sub);line-height:1.7}
.hb p b{color:var(--ink)}
.hb .tg,.hb .cat,.hb .btn{pointer-events:none;display:inline-block;margin:2px 4px 2px 0;vertical-align:middle}
.hb .btn{height:auto;padding:4px 12px;font-size:14px}

/* 대화상자 */
#dlg{position:fixed;inset:0;background:rgba(0,23,51,.32);display:none;align-items:center;justify-content:center;z-index:30}
#dlg.on{display:flex}
#dlg .box{background:var(--bg);border-radius:var(--r-card);padding:24px;width:min(620px,94vw);max-height:90vh;overflow:auto;box-shadow:var(--float)}
#dlg h3{margin:0 0 12px;font-size:20px}

/* 화면이 안 돌 때 원인 문구 · 웹판 첫 화면(비밀번호) */
#fatal{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);padding:48px 24px;font-size:18px;line-height:1.7;white-space:pre-line;color:var(--ink)}
#boot{position:fixed;inset:0;z-index:40;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:16px}
#boot .box{background:var(--bg);border-radius:20px;padding:36px 28px 28px;width:100%;max-width:420px;box-shadow:var(--float)}
#boot h1{font-size:24px;margin:0 0 6px;font-weight:700;letter-spacing:-.3px}
#boot .box::after{content:'두원알앤에이 · RChatAI';display:block;margin-top:20px;text-align:center;font-size:14px;color:var(--faint);font-weight:600}
#boot form{margin-top:22px}
#boot input{width:100%;height:56px;font-size:18px;padding:0 16px;border:1.5px solid transparent;border-radius:var(--r-ctl);margin:0 0 10px;background:var(--soft)}
#boot input:focus{outline:none;border-color:var(--ink);background:var(--bg)}
#boot button{width:100%;height:56px;font-size:18px;font-weight:700;border:0;border-radius:var(--r-ctl);background:var(--ink);color:#fff}
#boot button:disabled{opacity:.5}
#boot .msg{min-height:1.6em;margin:12px 0 0;font-size:15px;color:var(--sub);text-align:center}
#boot .msg.bad{color:var(--err);font-weight:700}

/* 휴대폰·좁은 창 */
@media (max-width:900px){
  #top{height:56px;padding:0 16px;gap:10px}
  #top h1{font-size:17px}
  #mExport,#saveSt{display:none}
  .progress{font-size:14px}
  #wrap{display:block}
  #side{position:sticky;top:56px;z-index:4;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;overflow:visible}
  #side .find,.sidefoot{display:none}
  #tree{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
  #tree::-webkit-scrollbar{display:none}
  .hp,.gr,.ty{flex:0 0 auto;margin:0;padding:7px 14px;border-radius:999px;background:var(--soft);font-size:15px;white-space:nowrap}
  .hp::after{display:none}
  .hp.cur,.gr.cur,.ty.cur{background:var(--ink);color:#fff}
  .hp.cur small,.gr.cur small,.ty.cur small{color:#fff}
  .gr small{margin-left:4px}
  #main{padding:20px 16px 24px}
  .ch h2{font-size:22px}
  .cats{flex-wrap:nowrap;overflow-x:auto;margin:12px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:0 0 auto;white-space:nowrap}
  .sec{padding:2px 14px 6px;border-radius:14px}
  .row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"rl rx" "rc rc";gap:8px 6px;padding:12px 0}
  .row.nolabel{grid-template-areas:"rc rx"}
  .rl{grid-area:rl;padding-top:4px}
  .rc{grid-area:rc}
  .rx{grid-area:rx;padding-top:0}
  .tg{font-size:15px;padding:6px 12px}
  .addbox{margin-left:0}
  .foot2{gap:6px;margin:20px -16px 0;padding:10px 16px 12px}
  .foot2 .pos{display:none}
  .foot2 #cOk{margin-left:auto}
  .btn{height:48px;padding:0 14px;font-size:15px}
  .hs{padding:16px;gap:12px}
}
</style>
</head>
<body>
<div id="top">
  <h1>부품 상담 지식 정리</h1>
  <span id="label" style="display:none"></span>
  <div class="progress"><div class="bar"><i id="barfill"></i></div><span id="prog">-</span></div>
  <span class="st" id="saveSt">-</span>
  <span class="st" id="sendSt">-</span>
  <span class="spacer"></span>
  <button class="plain" id="mExport" title="지금까지 고른 내용을 다운로드 폴더에 파일로 저장">파일로 저장</button>
</div>
<div id="wrap">

<div id="dlg"><div class="box" id="dlgBox"></div></div>

window.addEventListener('error', function(e){ if (!window.__appReady) window.__fatal('화면을 띄우지 못했습니다.\n원인: ' + (e && e.message ? e.message : '알 수 없는 오류')); });
</script>
<script id="data" type="application/json"></script>

  if (!d.on) return;
  document.body.classList.remove('dragging');
  const key = d.row.dataset.row, ids = [...d.box.querySelectorAll('.tg[data-cid]')].map(x=>x.dataset.cid);
  const r = d.el.getBoundingClientRect(), g = d.ghost;
  g.style.transition = 'left .14s ease, top .14s ease, transform .14s ease'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; g.style.transform = 'scale(1)';
  swallowClick = true; setTimeout(()=>{ swallowClick = false; }, 60);
  setTimeout(()=>{ g.remove(); if (apply && setChipOrder(key, ids)) toast('순서 바꿈'); lastTg = null; renderCat(); }, 150);
}
window.addEventListener('pointerup', ()=>endDrag(true));
window.addEventListener('pointercancel', ()=>endDrag(false));
window.addEventListener('click', e=>{ if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);
window.addEventListener('pagehide', ()=>{ finishRen(true, true); flushMemo(); });
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) flushMemo(); });
window.addEventListener('storage', e=>{ if (e.key===KEY) { S = load(); render(); refreshProgress(); } });

// ── 시작
(function init(){
  try { localStorage.setItem(KEY+'-probe','1'); localStorage.removeItem(KEY+'-probe'); setSaveSt('저장 준비',''); }
  catch(e) { storageOK=false; setSaveSt('저장 불가 · 담당자 문의','bad'); }
  if (CONFIG.label) { const l=$('#label'); l.textContent=CONFIG.label; l.style.display=''; }
  if (CONFIG.web) { $('#mExport').style.display = CONFIG.readOnly ? 'none' : ''; if (CONFIG.nodes) applyServer(CONFIG.nodes); }     // 웹판: 서버 기록이 정본
  for (const no of CATS) { if ((cardsOfType[no]||[]).some(c=>c.base && c.branch==='필수 확인 사항')) syncSubs(no); if ((cardsOfType[no]||[]).some(c=>c.base && c.branch==='세트 구성')) syncSubs(no, '세트 구성'); }     // 전체 줄에서 내려온 값이 예전 기록의 글에도 들어가게
  if (pendingCount()) save();
  refreshProgress(); render(); showSendState();
  if (pendingCount()) scheduleSend(3000);
  window.__appReady = true;
})();
</script>
